<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>供应链降本逻辑拆解 | Gerald Leung</title>
    <style>
      :root {
        --ink: #121119;
        --panel: #17151f;
        --paper: #f5f2ff;
        --muted: rgba(245, 242, 255, 0.72);
        --line: rgba(245, 242, 255, 0.22);
        --lavender: rgb(176, 145, 243);
        --pink: #ff89c2;
        --lime: #cef26a;
        --blue: #5797ff;
        --orange: #ffa95c;
      }

      @font-face {
        font-family: "LXGW WenKai";
        src:
          url("../../assets/fonts/LXGWWenKai-Gerald-subset.woff2?v=20260806") format("woff2"),
          url("../../assets/fonts/LXGWWenKai-Medium.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: Inter, "Segoe UI", "LXGW WenKai", "Microsoft YaHei", sans-serif;
        font-weight: 800;
        letter-spacing: 0;
      }

      .page {
        min-height: 100vh;
        background:
          linear-gradient(90deg, rgba(176, 145, 243, 0.08), transparent 30%, rgba(206, 242, 106, 0.05) 100%),
          var(--ink);
      }

      .topbar {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 64px;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 17, 25, 0.92);
      }

      .brand {
        color: var(--lavender);
        font-size: 21px;
        line-height: 1;
      }

      .nav {
        display: flex;
        gap: 28px;
        color: var(--paper);
        font-size: 15px;
      }

      .hero {
        min-height: calc(100vh - 70px);
        display: grid;
        grid-template-columns: minmax(680px, 0.95fr) minmax(760px, 1.15fr);
        gap: 36px;
        align-items: center;
        padding: 62px 64px 48px;
      }

      .intro {
        max-width: 700px;
      }

      h1 {
        margin: 0 0 26px;
        font-size: 72px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .definition {
        margin: 0;
        max-width: 700px;
        color: var(--paper);
        font-size: 26px;
        line-height: 1.48;
      }

      .anchors {
        display: grid;
        gap: 18px;
        margin-top: 34px;
      }

      .anchor {
        display: grid;
        grid-template-columns: 14px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
        padding-bottom: 18px;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.45;
      }

      .anchor::before {
        content: "";
        width: 9px;
        height: 9px;
        margin-top: 10px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 0 5px rgba(206, 242, 106, 0.12);
      }

      .outcomes {
        margin-top: 34px;
        padding: 24px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .outcomes h2 {
        margin: 0 0 20px;
        color: var(--lavender);
        font-size: 24px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .metric {
        min-height: 116px;
        display: grid;
        align-content: center;
        gap: 12px;
        padding: 18px 20px;
        border: 1px solid rgba(245, 242, 255, 0.20);
        border-radius: 6px;
        background: rgba(245, 242, 255, 0.035);
      }

      .metric.actual {
        border-color: rgba(206, 242, 106, 0.56);
        background: rgba(206, 242, 106, 0.08);
      }

      .metric-label {
        color: var(--muted);
        font-size: 17px;
        line-height: 1;
      }

      .metric-value {
        color: var(--paper);
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 42px;
        line-height: 0.94;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .metric.actual .metric-value {
        color: var(--lime);
        font-size: 64px;
      }

      .visual {
        position: relative;
        min-height: 748px;
        border: 1px solid rgba(245, 242, 255, 0.28);
        background:
          linear-gradient(180deg, rgba(245, 242, 255, 0.045), rgba(245, 242, 255, 0.01)),
          var(--panel);
        overflow: hidden;
      }

      .visual-title {
        position: absolute;
        left: 38px;
        top: 34px;
        display: flex;
        align-items: center;
        color: var(--paper);
        font-size: 22px;
      }

      .visual-title::before {
        content: none;
      }

      .diagram {
        position: absolute;
        left: 50%;
        top: 54%;
        width: min(94%, 1040px);
        height: 632px;
        transform: translate(-50%, -50%);
      }

      .active-modal {
        display: none;
      }

      .active-modal h3 {
        margin: 0 0 14px;
        color: var(--paper);
        font-size: 20px;
        line-height: 1.1;
      }

      .modal-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
      }

      .modal-metric {
        display: grid;
        gap: 4px;
      }

      .modal-metric span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.25;
      }

      .modal-metric b {
        color: var(--lime);
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 25px;
        line-height: 1;
      }

      .active-modal p {
        margin: 12px 0 0;
        color: rgba(245, 242, 255, 0.78);
        font-size: 14px;
        line-height: 1.38;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(18, 17, 25, 0.86);
      }

      .full-modal {
        position: fixed;
        inset: 92px 112px 64px;
        z-index: 110;
        display: grid;
        grid-template-columns: minmax(0, 1.9fr) minmax(360px, 0.9fr);
        gap: 34px;
        padding: 34px;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(245, 242, 255, 0.5);
        background: var(--ink);
        box-shadow: 0 34px 95px rgba(0, 0, 0, 0.58);
      }

      .close-button {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 4;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(245, 242, 255, 0.35);
        background: rgba(245, 242, 255, 0.08);
        color: rgba(245, 242, 255, 0.9);
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 28px;
        line-height: 1;
        cursor: default;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      }

      .evidence {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(245, 242, 255, 0.22);
        background: #17151f;
      }

      .evidence-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 28px 16px;
      }

      .evidence-title h2 {
        margin: 0;
        font-size: 30px;
        line-height: 1.05;
      }

      .legend {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: flex-end;
        color: rgba(245, 242, 255, 0.68);
        font-size: 15px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .legend i {
        display: inline-block;
        width: 24px;
        height: 10px;
      }

      .legend i.up { background: var(--lime); }
      .legend i.down { background: var(--pink); }

      .sea-bg { background: rgb(91, 145, 232); }
      .fast-land-bg { background: rgb(142, 203, 91); }
      .express-air-bg { background: rgb(255, 169, 92); }

      .evidence-body {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 16px;
        padding: 0 30px 30px;
      }

      .stack-panel {
        display: grid;
        gap: 20px;
        padding: 28px 20px;
        border: 1px solid rgba(245, 242, 255, 0.24);
        background: rgba(245, 242, 255, 0.024);
      }

      .stack-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 18px;
        align-items: center;
      }

      .stack-year {
        color: rgba(245, 242, 255, 0.82);
        font-size: 20px;
        text-align: center;
      }

      .stack-bar {
        display: flex;
        height: 72px;
        overflow: visible;
        border: 1px solid rgba(245, 242, 255, 0.24);
        background: rgba(245, 242, 255, 0.04);
      }

      .stack-segment {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        color: #10131a;
        font-size: 18px;
        line-height: 1;
      }

      .stack-segment.small span {
        position: absolute;
        top: 50%;
        right: 2px;
        color: #10131a;
        font-size: 15px;
        transform: translateY(-50%);
        white-space: nowrap;
      }

      .stack-segment.micro-callout span {
        top: 49px;
        right: 74px;
        z-index: 4;
        font-size: 18px;
        transform: none;
      }

      .stack-segment.micro-callout::after {
        content: "";
        position: absolute;
        top: 39px;
        right: 12px;
        z-index: 3;
        width: 62px;
        height: 2px;
        background: #10131a;
        transform: rotate(-22deg);
        transform-origin: right center;
      }

      .impact-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .impact-card {
        display: grid;
        align-content: center;
        min-height: 92px;
        padding: 16px 18px;
        border: 1px solid rgba(245, 242, 255, 0.22);
        background: rgba(245, 242, 255, 0.03);
      }

      .impact-card .label {
        color: rgba(245, 242, 255, 0.64);
        font-size: 14px;
      }

      .impact-card .value {
        margin-top: 8px;
        color: var(--paper);
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 34px;
        line-height: 1;
      }

      .impact-card.result {
        border-color: rgba(206, 242, 106, 0.48);
        background: rgba(206, 242, 106, 0.04);
      }

      .impact-card.result .value {
        color: var(--lime);
      }

      .share-table {
        display: grid;
        border: 1px solid rgba(245, 242, 255, 0.24);
      }

      .share-head,
      .share-row {
        display: grid;
        grid-template-columns: 1.16fr 0.9fr 0.9fr 2.65fr 0.88fr;
        align-items: center;
      }

      .share-head {
        min-height: 44px;
        border-bottom: 1px solid rgba(245, 242, 255, 0.22);
        color: rgba(245, 242, 255, 0.62);
        font-size: 13px;
      }

      .share-head > div,
      .share-row > div {
        padding: 0 14px;
      }

      .share-row {
        min-height: 74px;
        border-bottom: 1px solid rgba(245, 242, 255, 0.11);
      }

      .share-row:last-child {
        border-bottom: 0;
      }

      .mode-name,
      .share-num,
      .share-value {
        color: rgba(245, 242, 255, 0.84);
        font-size: 18px;
      }

      .share-track {
        position: relative;
        height: 30px;
      }

      .share-track::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 6px;
        bottom: 6px;
        width: 1px;
        background: rgba(245, 242, 255, 0.28);
      }

      .share-delta {
        position: absolute;
        top: 4px;
        height: 22px;
      }

      .share-delta.up {
        left: 50%;
        width: var(--w);
        background: rgba(255, 137, 194, 0.78);
      }

      .share-delta.down {
        right: 50%;
        width: var(--w);
        background: rgba(206, 242, 106, 0.78);
      }

      .share-value.up { color: var(--pink); }
      .share-value.down { color: var(--lime); }

      .modal-copy {
        display: grid;
        align-content: start;
        gap: 20px;
        min-height: 0;
        overflow: auto;
        padding-right: 8px;
      }

      .modal-copy h2 {
        margin: 0;
        color: var(--paper);
        font-size: 34px;
        line-height: 1;
      }

      .modal-copy section {
        padding-top: 18px;
        border-top: 1px solid rgba(245, 242, 255, 0.18);
      }

      .modal-copy h3 {
        margin: 0 0 10px;
        color: var(--lavender);
        font-size: 18px;
        line-height: 1.15;
      }

      .modal-copy p {
        margin: 0 0 8px;
        color: rgba(245, 242, 255, 0.78);
        font-size: 15px;
        line-height: 1.48;
      }

      .logic-graph {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .logic-full {
        display: block;
        width: 100%;
        height: 100%;
      }

      .logic-graph > .logic-lines,
      .logic-graph > .g-node {
        display: none;
      }

      .interactive-node {
        cursor: default;
        outline: none;
      }

      .interactive-node[data-modal] {
        cursor: pointer;
      }

      .interactive-node[data-modal]:hover .node-box,
      .interactive-node[data-modal]:focus-visible .node-box {
        stroke: var(--lime);
        filter: drop-shadow(0 0 12px rgba(206, 242, 106, 0.42));
      }

      .node-tooltip {
        position: fixed;
        z-index: 90;
        width: 312px;
        padding: 13px 15px;
        border: 1px solid rgba(176, 145, 243, 0.78);
        background: #211d2d;
        color: var(--paper);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
        font-size: 13px;
        line-height: 1.45;
        pointer-events: none;
      }

      .logic-lines {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .logic-lines path {
        fill: none;
        stroke: var(--lavender);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .logic-lines .same-action {
        stroke-dasharray: 10 10;
      }

      .g-node {
        position: absolute;
        width: 154px;
        min-height: 54px;
        display: grid;
        place-items: center;
        padding: 0 12px;
        border: 2px solid rgba(245, 242, 255, 0.58);
        border-radius: 6px;
        background: rgba(255, 137, 194, 0.84);
        color: #10131a;
        box-shadow: 0 0 14px rgba(245, 242, 255, 0.22);
        font-size: 17px;
        line-height: 1.18;
        text-align: center;
      }

      .g-node.root {
        background: rgba(255, 137, 194, 0.94);
        font-size: 18px;
      }

      .g-node.inventory {
        background: rgba(87, 151, 255, 0.92);
        color: var(--paper);
      }

      .g-root { left: 36px; top: 253px; }
      .g-head { left: 260px; top: 77px; }
      .g-tail { left: 260px; top: 207px; }
      .g-ware { left: 260px; top: 337px; }
      .g-purchase { left: 260px; top: 467px; }
      .g-mode-structure { left: 500px; top: 37px; }
      .g-inventory-head { left: 500px; top: 127px; }
      .g-tail-price { left: 500px; top: 187px; }
      .g-order-dist { left: 500px; top: 263px; }
      .g-rent-price { left: 500px; top: 337px; }
      .g-inventory-ware { left: 500px; top: 427px; }
      .g-mode-price { left: 730px; top: 17px; }
      .g-ship-volume { left: 730px; top: 101px; }

      .sections {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        border-top: 1px solid var(--line);
      }

      .band {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 58px;
        padding: 54px 64px;
        border-bottom: 1px solid var(--line);
      }

      .band h2 {
        margin: 0;
        font-size: 38px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .band-body {
        display: grid;
        gap: 28px;
      }

      .lead {
        margin: 0;
        max-width: 980px;
        color: var(--paper);
        font-size: 23px;
        line-height: 1.58;
      }

      .cost-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      .cost-item {
        min-height: 172px;
        padding: 20px 18px;
        border: 1px solid rgba(245, 242, 255, 0.24);
        border-radius: 6px;
        background: rgba(245, 242, 255, 0.035);
      }

      .cost-item h3 {
        margin: 0 0 14px;
        color: var(--paper);
        font-size: 23px;
        line-height: 1.15;
      }

      .cost-item p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.55;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 28px;
      }

      .note {
        padding: 26px 28px;
        border-left: 6px solid var(--blue);
        background: rgba(87, 151, 255, 0.10);
      }

      .note h3 {
        margin: 0 0 14px;
        font-size: 26px;
        line-height: 1.16;
      }

      .note p {
        margin: 0;
        color: var(--muted);
        font-size: 20px;
        line-height: 1.58;
      }

      .mapping {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: stretch;
        gap: 12px;
      }

      .map-step {
        min-height: 96px;
        display: grid;
        place-items: center;
        padding: 16px;
        border: 1px solid rgba(206, 242, 106, 0.38);
        border-radius: 6px;
        color: var(--paper);
        font-size: 20px;
        text-align: center;
        line-height: 1.25;
      }

      .map-step:nth-child(odd) {
        background: rgba(206, 242, 106, 0.08);
      }

      @media (max-width: 900px) {
        .topbar {
          height: 62px;
          padding: 0 20px;
        }

        .nav {
          gap: 16px;
          font-size: 13px;
        }

        .hero,
        .band {
          grid-template-columns: 1fr;
          padding: 40px 20px;
        }

        h1 {
          font-size: 48px;
        }

        .definition {
          font-size: 21px;
        }

        .visual {
          min-height: 460px;
        }

        .diagram {
          width: 720px;
          transform: translate(-50%, -50%) scale(0.45);
        }

        .cost-grid,
        .split,
        .mapping {
          grid-template-columns: 1fr;
        }
      }

      [hidden] { display: none !important; }

      body.modal-open {
        overflow: hidden;
      }

      .modal-shell {
        position: fixed;
        inset: 0;
        z-index: 100;
      }

      .modal-shell .modal-overlay {
        z-index: 100;
      }

      .modal-shell .full-modal {
        z-index: 110;
      }

      .modal-content {
        display: contents;
      }

      .g-node {
        font-family: inherit;
        border-radius: 5px;
      }

      button.g-node {
        appearance: none;
        border: 2px solid rgba(245, 242, 255, 0.58);
        cursor: pointer;
      }

      button.g-node:hover,
      button.g-node:focus-visible {
        border-color: var(--lime);
        outline: none;
        box-shadow: 0 0 0 3px rgba(206, 242, 106, 0.22);
      }

      .result-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .result-card,
      .result-change {
        display: grid;
        align-content: center;
        min-height: 108px;
        padding: 18px 20px;
        border: 1px solid rgba(245, 242, 255, 0.22);
        background: rgba(245, 242, 255, 0.03);
      }

      .result-card .year,
      .result-change .label {
        color: rgba(245, 242, 255, 0.64);
        font-size: 15px;
      }

      .result-card .value,
      .result-change .value {
        margin-top: 8px;
        color: var(--paper);
        font-family: Inter, "Segoe UI", sans-serif;
        font-size: 42px;
        line-height: 1;
      }

      .result-card.current .value,
      .result-change .value {
        color: var(--lime);
      }

      .result-change {
        border-color: rgba(206, 242, 106, 0.48);
        background: rgba(206, 242, 106, 0.04);
      }

      .result-change.pink,
      .result-card.pink {
        border-color: rgba(255, 137, 194, 0.48);
        background: rgba(255, 137, 194, 0.04);
      }

      .result-change.pink .value,
      .result-card.pink .value {
        color: var(--pink);
      }

      .price-table,
      .zone-table {
        display: grid;
        border: 1px solid rgba(245, 242, 255, 0.24);
      }

      .price-head,
      .price-row,
      .zone-head,
      .zone-row {
        display: grid;
        align-items: center;
        min-height: 74px;
        border-bottom: 1px solid rgba(245, 242, 255, 0.11);
      }

      .price-head,
      .zone-head {
        min-height: 50px;
        color: rgba(245, 242, 255, 0.62);
        font-size: 14px;
      }

      .price-row:last-child,
      .zone-row:last-child {
        border-bottom: 0;
      }

      .price-head,
      .price-row {
        grid-template-columns: 1.18fr 0.72fr 0.72fr 2.3fr 0.72fr;
      }

      .zone-head,
      .zone-row {
        grid-template-columns: 1.05fr 0.72fr 0.72fr 2.4fr 0.78fr;
      }

      .price-head > div,
      .price-row > div,
      .zone-head > div,
      .zone-row > div {
        padding: 0 14px;
      }

      .price-name,
      .price-num,
      .price-value,

    <script>
      (() => {
        const shell = document.querySelector('[data-modal-shell]');
        const dialog = shell?.querySelector('.full-modal');
        const content = shell?.querySelector('[data-modal-content]');
        const tooltip = document.querySelector('[data-node-tooltip]');
        const openers = document.querySelectorAll('.logic-full [data-modal]');
        const tooltipNodes = document.querySelectorAll('.logic-graph [data-tip]');
        const tipText = {
          'mode-structure': '不同头程物流方式的发货占比。低单价方式占比提升、高单价方式占比下降，会改善整体头程成本结构。',
          'inventory-control': '通过发货前的安库策略和库存发出后的库龄推演，预判未来缺口与仓租风险，辅助库存决策。',
          'tail-price': '订单尾程配送的单位成本。物流商管理、报价优化和服务商切换会影响不同 Zone 的尾程单价。',
          'order-distribution': '通过预判订单区域分布，提高最优发货仓匹配度，使订单更靠近消费者，降低等待时间和尾程运费。',
          'unit-price': '不同头程物流方式的单位重量成本。固定发货结构后，可以单独观察渠道单价变化。'
        };

        if (!shell || !dialog || !content) return;

        const openModal = (id) => {
          const template = document.getElementById('modal-' + id);
          if (!template) return;
          const label = template.dataset.modalLabel || 'Detail';
          shell.dataset.activeModal = id;
          shell.classList.toggle('inventory-modal', id === 'inventory-control');
          content.innerHTML = template.innerHTML;
          const title = content.querySelector('.modal-copy h2') || content.querySelector('.evidence-title h2');
          if (title) title.id = 'modal-title';
          dialog.setAttribute('aria-label', label);
          shell.hidden = false;
          document.body.classList.add('modal-open');
          dialog.focus({ preventScroll: true });
        };

        const closeModal = () => {
          shell.hidden = true;
          delete shell.dataset.activeModal;
          shell.classList.remove('inventory-modal');
          content.innerHTML = '';
          document.body.classList.remove('modal-open');
        };

        openers.forEach((node) => {
          node.addEventListener('click', () => openModal(node.dataset.modal));
          node.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openModal(node.dataset.modal);
            }
          });
        });

        tooltipNodes.forEach((node) => {
          const showTooltip = () => {
            const text = node.dataset.tip || tipText[node.dataset.modal];
            if (!tooltip || !text) return;
            const rect = node.getBoundingClientRect();
            tooltip.textContent = text;
            tooltip.hidden = false;
            const top = Math.max(18, rect.top - tooltip.offsetHeight - 14);
            const left = Math.min(window.innerWidth - tooltip.offsetWidth - 18, Math.max(18, rect.left + rect.width / 2 - tooltip.offsetWidth / 2));
            tooltip.style.top = `${top}px`;
            tooltip.style.left = `${left}px`;
          };

          const hideTooltip = () => {
            if (!tooltip) return;
            tooltip.hidden = true;
          };

          node.addEventListener('mouseenter', showTooltip);
          node.addEventListener('mouseleave', hideTooltip);
          node.addEventListener('focus', showTooltip);
          node.addEventListener('blur', hideTooltip);
        });

        shell.addEventListener('click', (event) => {
          if (event.target.closest('[data-modal-close]')) closeModal();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !shell.hidden) closeModal();
        });

        const params = new URLSearchParams(window.location.search);
        const initialTip = params.get('tip');
        if (initialTip) {
          const node = document.querySelector(`.logic-full [data-modal="${initialTip}"], .logic-full [data-tip-key="${initialTip}"]`);
          if (node) requestAnimationFrame(() => node.dispatchEvent(new Event('mouseenter')));
        }

        const initial = params.get('modal');
        if (initial) openModal(initial);
      })();
    </script>
  </body>
